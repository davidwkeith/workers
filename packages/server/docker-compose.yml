# Central-mode reference deployment (spec/scale-out.md, phase 5 / #434):
# sqld (libSQL primary + coordination KV) + MinIO (S3-compatible object
# store) + 2 stateless `@dwk/server` replicas behind an nginx proxy — the
# smallest topology that actually exercises horizontal scale-out (spec
# §14 item 4 calls out ">=2 replicas" as the bar for both live verification
# and hosted-suite conformance). Bring it up from the repo root:
#
#   docker compose -f packages/server/docker-compose.yml up --build
#
# Then see conformance/scale-out-qa.md for the live-verification checklist
# and the hosted-suite run this compose file is the test bed for. Do NOT use
# this for a real single-owner deployment — README.md's "When not to use
# central mode" section explains why local mode (the plain `Dockerfile`,
# no compose) stays the recommended default.
#
# Both replicas run the exact same image, built from the same
# `examples/central-composition.mjs` reference composition (WebFinger +
# IndieAuth + WebAuthn) — "identical replicas, ephemeral disk only" per
# spec/scale-out.md §4. Swap the `BUNDLE_ENTRY` build arg for your own
# central-mode composition module.
#
# sqld's image/env shape here follows its published Docker docs
# (github.com/tursodatabase/libsql, docs/DOCKER.md — `SQLD_NODE`,
# `SQLD_HTTP_LISTEN_ADDR` defaulting to `0.0.0.0:8080`, data at
# `/var/lib/sqld`); double-check against the current sqld release notes if
# this compose file fails to boot sqld — bringing it up successfully for the
# first time against a given sqld version is itself part of the §14
# live-verification checklist. No documented HTTP health endpoint and no
# guaranteed shell/curl in the image, so `sqld` has no container-level
# healthcheck here — `server1`/`server2`'s own fail-loud startup probes
# (`probeCentralStores`, spec/scale-out.md §9.2) are what actually detect an
# unready sqld, and `restart: unless-stopped` below is what recovers from it,
# which is the documented contract, not a workaround.
name: dwk-central

services:
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    environment:
      SQLD_NODE: primary
    ports:
      - "8080:8080" # hrana-over-HTTP — what @libsql/client talks to
    volumes:
      - sqld-data:/var/lib/sqld

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DWK_S3_ACCESS_KEY_ID:-dwk-minio}
      MINIO_ROOT_PASSWORD: ${DWK_S3_SECRET_ACCESS_KEY:-dwk-minio-secret}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the media bucket, then exit. `server1`/`server2` don't
  # depend on this finishing (a PUT against a missing bucket just 404s/500s
  # until it has), but running it first avoids that race in practice.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${DWK_S3_ACCESS_KEY_ID:-dwk-minio} ${DWK_S3_SECRET_ACCESS_KEY:-dwk-minio-secret} &&
      mc mb --ignore-existing local/dwk-media
      "

  server1:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
      args:
        BUNDLE_ENTRY: packages/server/examples/central-composition.mjs
    depends_on:
      sqld:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment: &server-env
      DWK_BASE_URL: ${DWK_BASE_URL:-http://localhost:8000}
      DWK_LIBSQL_URL: http://sqld:8080
      DWK_S3_ACCESS_KEY_ID: ${DWK_S3_ACCESS_KEY_ID:-dwk-minio}
      DWK_S3_SECRET_ACCESS_KEY: ${DWK_S3_SECRET_ACCESS_KEY:-dwk-minio-secret}
      DWK_S3_REGION: us-east-1
      DWK_R2_ENDPOINT: http://minio:9000/dwk-media
      DWK_TOKEN_SIGNING_KEY: ${DWK_TOKEN_SIGNING_KEY:-dev-signing-key-change-me}
      DWK_REPLICA_DIR: /replicas
      PORT: 3000
    # `/replicas` is a rebuildable embedded-replica cache (spec/scale-out.md
    # §6.2) — an anonymous/ephemeral volume is correct; it never needs backup
    # and re-syncs from sqld on first access after a restart.
    volumes:
      - replica1-scratch:/replicas
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  server2:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
      args:
        BUNDLE_ENTRY: packages/server/examples/central-composition.mjs
    depends_on:
      sqld:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment: *server-env
    volumes:
      - replica2-scratch:/replicas
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Round-robin load balancer over the two replicas — stands in for
  # whatever ingress/ALB/proxy a real deployment fronts the fleet with
  # (spec/scale-out.md §4's "load balancer / ingress" box). See nginx.conf
  # for the WebSocket session-affinity note (spec §6.4).
  proxy:
    image: nginx:stable
    depends_on:
      server1:
        condition: service_healthy
      server2:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  sqld-data:
  minio-data:
  replica1-scratch:
  replica2-scratch:
