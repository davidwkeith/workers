# Reference load-balancer config for the docker-compose central-mode
# deployment (spec/scale-out.md §4, §6.4). Round-robins ordinary requests
# across both replicas; a client's WebSocket upgrade (the Solid notifications
# endpoint, the atproto firehose — whichever DO-WebSocket package your own
# composition mounts) is pinned to the replica that terminated it via
# `ip_hash`, since a live socket does not re-acquire the per-request lease
# (spec/scale-out.md §6.4 — the accepted v1 limitation, not a bug to fix
# here). This example's reference composition (webfinger + indieauth +
# webauthn) mounts no WebSocket path, so nothing here actually upgrades —
# adjust `location` below to your own mount's reserved path if you add one
# (e.g. `/notifications` for solid-pod, `/firehose` for atproto-pds).

upstream dwk_default {
    server server1:3000;
    server server2:3000;
}

# A second pool with sticky routing, for whichever paths your composition
# uses for long-lived WebSocket connections.
upstream dwk_websocket_affinity {
    ip_hash;
    server server1:3000;
    server server2:3000;
}

server {
    listen 80;

    location /notifications {
        proxy_pass http://dwk_websocket_affinity;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://dwk_default;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
