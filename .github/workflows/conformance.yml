name: Conformance

# Wires conformance + the release gate into CI (issue #12). The cheap, always-on
# jobs (release-gate, integration) run on every PR/push and gate stable
# releases. The hosted conformance suites need a deployed, publicly reachable
# Worker, so they run on demand (workflow_dispatch) or on a weekly schedule,
# against a target URL — they never block ordinary pushes.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      standard:
        description: "Which hosted suite to run"
        required: true
        type: choice
        options: [micropub, webmention, solid]
      target_url:
        description: "Base URL of a deployed Worker to test"
        required: false

jobs:
  # Static guard: refuses to let any package go stable (>=1.0.0) before its
  # conformance suites + integration lifecycle tests are recorded as passing.
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit-test the release gate
        run: pnpm test:gate
      - name: Enforce release gate
        run: pnpm release:gate

  # Verb-lifecycle integration tests (authenticated GET-through-WAC; PATCH with
  # where/conflict; If-Match preconditioned writes) under workerd/Miniflare.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Integration lifecycle tests
        run: pnpm test:integration

  # Hosted conformance suites: only on manual dispatch or the weekly schedule,
  # since they require a deployed target. The runner is a documented no-op when
  # no target URL is supplied.
  hosted-suite:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        standard: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.standard)) || fromJSON('["micropub","webmention","solid"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run hosted conformance suite
        run: |
          node scripts/conformance/run-suite.mjs "${{ matrix.standard }}" \
            ${{ inputs.target_url && format('--target {0}', inputs.target_url) || '' }}
