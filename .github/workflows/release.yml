name: Release

# Manual, deliberate publish of the @dwk/* packages to npm.
#
# The repo is in Changesets "pre" mode (tag `beta`), so versions are managed
# locally (`changeset version`) and committed before a release is cut. This
# workflow does NOT bump versions — it publishes whatever `0.1.0-beta.N` is in
# the committed package.json files, exactly like running `pnpm release` locally
# (release:gate -> build -> changeset publish), then pushes the git tags that
# `changeset publish` creates.
#
# Authenticates via npm Trusted Publishing (OIDC) — no stored npm token.
# Each publishable @dwk/* package must have a Trusted Publisher configured on
# npmjs.com (package Settings -> Trusted Publisher): GitHub Actions, org/user
# `davidwkeith`, repo `workers`, workflow filename `release.yml`, environment
# `npm-publish`, allowed action `npm publish`. See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + gate only; skip the actual npm publish"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the git tags changeset publish creates
  id-token: write # npm Trusted Publishing (OIDC) auth + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    # The Trusted Publisher config on npmjs.com is scoped to this environment
    # name; attach any environment protection rules (required reviewers,
    # branch restrictions) here too.
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history so changeset can tag releases

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Node 24 so the @dwk/server SQLite shims (built-in `node:sqlite`) run
          # flag-free; matches ci.yml.
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; don't rely on whatever
      # ships with the Node 24 setup-node distribution happening to clear that.
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirror the ci.yml gate so we never publish an artifact that wouldn't
      # pass CI. The release gate inside `pnpm release` runs again, but lint /
      # format / typecheck / test are not part of `pnpm release`.
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Build before test: package tests import sibling @dwk/* deps through their
      # `exports` map (dist/), so the workspace must be built first. Matches the
      # build -> test order in ci.yml.
      - name: Build
        run: pnpm build

      - name: Test (with coverage)
        run: pnpm test:coverage

      # conformance.yml's release-gate job already enforces this on every
      # PR/push, but the release workflow didn't — a package could ship
      # without a catalog.json decision if that check alone had drifted.
      - name: Enforce catalog gate (catalog.json covers every package)
        run: pnpm catalog:check

      - name: Release gate (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm release:gate

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        # `pnpm release` = release:gate -> build -> changeset publish.
        # NOTE: although we're in pre mode (tag `beta`), changeset publishes
        # packages that have never had a stable release to the `latest` dist-tag,
        # not `beta` — so until a 1.0.0 ships, `latest` tracks the newest beta and
        # plain `npm i @dwk/<pkg>` installs it. @dwk/server is `private` and skipped.
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Push release tags
        if: ${{ !inputs.dry_run }}
        # Do NOT rely on the lightweight tags `changeset publish` creates: in this
        # setup they do not survive into this step (`git push --tags` reports
        # "Everything up-to-date" despite changeset logging "New tag: ..."). Instead
        # re-derive a `name@version` tag for every publishable (non-private) package
        # from the committed package.json and push. Idempotent: existing tags are
        # skipped, so only the just-released versions get new tags.
        run: |
          for pkg in packages/*/package.json; do
            tag=$(node -e 'const p=require("./"+process.argv[1]); if(!p.private) console.log(p.name+"@"+p.version)' "$pkg")
            [ -n "$tag" ] && git tag "$tag" 2>/dev/null || true
          done
          git push origin --tags

      - name: Publish a GitHub Release for @dwk/server (drives docker.yml's `release` trigger)
        if: ${{ !inputs.dry_run }}
        # docker.yml's Docker-image job listens for `release: [published]`, but
        # nothing else in the repo ever creates a GitHub Release (only tags),
        # so that trigger was dead code. @dwk/server is private (never an npm
        # tag above), so it gets its own release tag here instead.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/server/package.json').version")
          tag="dwk-server-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists (no @dwk/server version bump this run); skipping."
          else
            gh release create "$tag" \
              --title "@dwk/server $version" \
              --notes "Self-host Docker image for @dwk/server $version. See packages/server/CHANGELOG.md for what changed."
          fi
