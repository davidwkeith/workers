name: Release

# Manual, deliberate publish of the @dwk/* packages to npm.
#
# The repo is in Changesets "pre" mode (tag `beta`), so versions are managed
# locally (`changeset version`) and committed before a release is cut. This
# workflow does NOT bump versions — it publishes whatever `0.1.0-beta.N` is in
# the committed package.json files, exactly like running `pnpm release` locally
# (release:gate -> build -> changeset publish), then pushes the git tags that
# `changeset publish` creates.
#
# Requires repo secret NPM_TOKEN: an npm automation/granular token with
# publish rights to the @dwk scope (automation tokens bypass 2FA prompts).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + gate only; skip the actual npm publish"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the git tags changeset publish creates
  id-token: write # npm provenance (OIDC) for published packages

jobs:
  release:
    runs-on: ubuntu-latest
    # NPM_TOKEN lives in the `npm-publish` environment; attach any environment
    # protection rules (required reviewers, branch restrictions) there.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so changeset can tag releases

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 24 so the @dwk/server SQLite shims (built-in `node:sqlite`) run
          # flag-free; matches ci.yml.
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirror the ci.yml gate so we never publish an artifact that wouldn't
      # pass CI. The release gate inside `pnpm release` runs again, but lint /
      # format / typecheck / test are not part of `pnpm release`.
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Build before test: package tests import sibling @dwk/* deps through their
      # `exports` map (dist/), so the workspace must be built first. Matches the
      # build -> test order in ci.yml.
      - name: Build
        run: pnpm build

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Release gate (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm release:gate

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        # `pnpm release` = release:gate -> build -> changeset publish.
        # NOTE: although we're in pre mode (tag `beta`), changeset publishes
        # packages that have never had a stable release to the `latest` dist-tag,
        # not `beta` — so until a 1.0.0 ships, `latest` tracks the newest beta and
        # plain `npm i @dwk/<pkg>` installs it. @dwk/server is `private` and skipped.
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Push release tags
        if: ${{ !inputs.dry_run }}
        # Do NOT rely on the lightweight tags `changeset publish` creates: in this
        # setup they do not survive into this step (`git push --tags` reports
        # "Everything up-to-date" despite changeset logging "New tag: ..."). Instead
        # re-derive a `name@version` tag for every publishable (non-private) package
        # from the committed package.json and push. Idempotent: existing tags are
        # skipped, so only the just-released versions get new tags.
        run: |
          for pkg in packages/*/package.json; do
            tag=$(node -e 'const p=require("./"+process.argv[1]); if(!p.private) console.log(p.name+"@"+p.version)' "$pkg")
            [ -n "$tag" ] && git tag "$tag" 2>/dev/null || true
          done
          git push origin --tags
